name: Generar IPA Gratis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar web e instalar Capacitor
        run: |
          npm install
          npm run build
          test -s .output/public/index.html
          rm -rf ios
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest
          npx cap add ios
          npx cap sync ios

      - name: Compilar proyecto iOS sin firma
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar archivo .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r MiApp.ipa Payload

      - name: Guardar .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: MiApp.ipa
