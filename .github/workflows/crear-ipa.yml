name: Generar IPA Gratis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar web e instalar Capacitor
        run: |
          npm install
          npm run build
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MiApp</title></head><body><div id="root"></div></body></html>' > .output/public/index.html
          fi
          rm -rf capacitor.config.ts capacitor.config.json ios
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest
          npx cap init "MiApp" "com.miapp.lovable" --web-dir .output/public
          npx cap add ios
          npx cap sync ios

      - name: Compilar proyecto iOS sin firma
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar archivo .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r MiApp.ipa Payload

      - name: Guardar .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: MiApp.ipa
